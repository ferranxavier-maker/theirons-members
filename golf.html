<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;background:#fff;color:#1a1a1a}
.hdr{padding:8px 12px 0;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10;background:#fff}
.htitle{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.htitle a{display:inline-flex;line-height:0;border:1px solid rgba(128,128,128,.45);border-radius:8px;padding:4px 8px}
.htitle img{height:44px;width:auto}
.htitle .sec{font-size:15px;font-weight:700;letter-spacing:.02em}
.tabs{display:flex;flex-wrap:wrap}
.tab{padding:8px 12px;font-size:12px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.content{padding:12px;display:none}
.content.on{display:block}
h2{font-size:15px;margin:4px 0 10px}
h3{font-size:13px;margin:16px 0 8px}
.nota{font-size:11px;color:#777;margin:6px 0 12px;line-height:1.5}
.vacio{padding:28px 12px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:10px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:11px}
th,td{padding:4px 6px;border:1px solid #e5e7eb;white-space:nowrap;text-align:center}
th{background:#f9fafb;font-weight:600}
td.izq,th.izq{text-align:left}
.jug{display:inline-flex;align-items:center;gap:6px}
.jug img,.jug .ini{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.jug .ini{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#333}
.num{font-variant-numeric:tabular-nums}
.big{font-size:13px;font-weight:700}
.dim{color:#999}
.gir{display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-left:2px;vertical-align:super}.gir.tp{background:#dc2626}
.ea{background:#fde68a}.bi{background:#bbf7d0}.pa{background:#fff}.bo{background:#fee2e2}.db{background:#fecaca}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid #e5e7eb;border-radius:10px;padding:10px}
.card .t{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:6px}
.card .v{font-size:18px;font-weight:700}
.card .s{font-size:11px;color:#666;margin-top:2px}
select,input{font-size:12px;padding:4px 6px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#1a1a1a;height:30px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
</style>
</head>

    gir:{ Capi:[1,2,3,7,17], Albert:[1,4,11,18], Cabra:[4,14,17,18], David:[] } }
];

// ============================================================
// SISTEMA MUNDIAL DE HÁNDICAP (WHS)
// ============================================================
const WHS = {
  VENTANA: 20,          // últimas 20 vueltas
  MAX_HI: 54,           // índice máximo
  PCT_JUEGO: 0.95,      // hándicap de juego medal/stableford individual
  TOPE_SIN_HI: 5,       // sin índice: tope de hoyo = par + 5
  TOPE_JUEGO: 3,        // se juega a triple bogey: se levanta la bola en par + 3 y ahí se para de contar
  // nº de diferenciales → [cuántos mejores, ajuste]
  TABLA: {3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],
          12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0],20:[8,0]},
  SOFT_CAP: 3, HARD_CAP: 5
};
// ============================================================
// EXECUTIVE: campo especial (9 hoyos, par muy bajo), con hándicap propio
// ============================================================
// No entra en el WHS ni en Hándicap, Stats, Tabla ni Records: va en su pestaña.
// Unidad = vuelta de 18 hoyos (los 9 del Executive jugados dos veces, par 64).
// HCP Executive = media de golpes sobre el par de las últimas VENTANA vueltas,
// sin descartes; sin HCP hasta llegar a VENTANA. Tope de hoyo: par + 3.
const EXEC = { CAMPO:'executive', HOYOS_VUELTA:18, VENTANA:10 };
const r1 = x => Math.round(x*10)/10;
WHS.TABLA_MIN = Math.min(...Object.keys(WHS.TABLA).map(Number));   // vueltas para tener índice (3)
const campoPorId = id => GOLF_CAMPOS.find(c=>c.id===id);
const parCampo = c => c.hoyos.reduce((s,h)=>s+h.par,0);
const jugador = ap => EQUIPO.find(j=>j.apodo===ap) || {apodo:ap};
const fmtFecha = iso => iso.split('-').reverse().join('/');
const fmt1 = x => x==null ? '—' : x.toFixed(1).replace('.',',');
const fmtD = d => d==null ? '—' : (d>0?'+'+d:String(d));

function indiceDe(difs){
  const n = Math.min(difs.length, WHS.VENTANA);
  const t = WHS.TABLA[n]; if(!t) return null;
  const ult = difs.slice(-WHS.VENTANA).slice().sort((a,b)=>a-b).slice(0,t[0]);
  return Math.min(WHS.MAX_HI, r1(ult.reduce((s,x)=>s+x,0)/ult.length + t[1]));
}
function hcpCampo(hi, tee, par){ return Math.round(hi*tee.slope/113 + (tee.cr - par)); }
function golpesRecibidos(ch, hcpHoyo){
  if(ch>=0) return Math.floor(ch/18) + (hcpHoyo <= ch%18 ? 1 : 0);
  return hcpHoyo > 18 - Math.min(18,-ch) ? -1 : 0;
}

// Procesa todas las vueltas en orden cronológico y devuelve una actuación por
// jugador y vuelta, con el índice que tenía antes, el resultado ajustado, el
// diferencial y el índice después.
function procesar(){
  const rondas = GOLF_RONDAS.map((r,i)=>({...r,_i:i})).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a._i-b._i);
  const est = {};   // apodo -> {difs:[], hist:[{fecha,hi}]}
  const acts = [];
  rondas.forEach((r,ri)=>{
    const c = campoPorId(r.campo); if(!c) return;
    if(c.id===EXEC.CAMPO) return;   // el Executive va aparte (pestaña Executive)
    const bar = r.barras || BARRAS_DEFECTO;
    const tee = c.tees ? c.tees[bar] : null; const par = parCampo(c);
    // Sin CR/slope o sin hándicap de hoyo la vuelta se registra pero no cuenta para el hándicap.
    const valido = !!tee && c.hoyos.every(h=>h.hcp!=null);
    Object.entries(r.jugadores).forEach(([ap,g0])=>{
      const g = g0.map((v,h)=>Math.min(v, c.hoyos[h].par+WHS.TOPE_JUEGO));
      const e = est[ap] || (est[ap]={difs:[],hist:[]});
      const hiAntes = e.difs.length>=3 ? e.hi : null;
      const ch = (hiAntes==null || !valido) ? null : hcpCampo(hiAntes, tee, par);
      const ph = ch==null ? null : Math.round(ch*WHS.PCT_JUEGO);
      const ajust = g.map((v,h)=>{
        const H=c.hoyos[h];
        const tope = ch==null ? H.par+WHS.TOPE_SIN_HI : H.par+2+golpesRecibidos(ch,H.hcp);
        return Math.min(v,tope);
      });
      const bruto = g.reduce((s,x)=>s+x,0);
      const ags = ajust.reduce((s,x)=>s+x,0);
      const dif = valido ? r1((113/tee.slope)*(ags - tee.cr)) : null;
      const stb = ph==null ? null : g.reduce((s,v,h)=>s+Math.max(0,2+c.hoyos[h].par+golpesRecibidos(ph,c.hoyos[h].hcp)-v),0);
      const neto = ph==null ? null : bruto - ph;
      if(!valido){
        acts.push({ronda:ri, fecha:r.fecha, campo:c, barras:bar, tee, par, apodo:ap, golpes:g, bruto, ags, dif:null,
                   hiAntes, hiDespues:hiAntes, ch:null, ph:null, stb:null, neto:null, G:girTramo(r,ap,0,g,c.hoyos)});
        return;
      }
      e.difs.push(dif);
      let hi = indiceDe(e.difs);
      // Soft/hard cap: solo con 20 diferenciales y respecto al índice más bajo de los 365 días previos.
      if(hi!=null && e.difs.length>=WHS.VENTANA){
        const desde = new Date(r.fecha); desde.setDate(desde.getDate()-365);
        const prev = e.hist.filter(x=>x.hi!=null && x.n>=WHS.VENTANA && new Date(x.fecha)>=desde).map(x=>x.hi);
        if(prev.length){
          const low = Math.min(...prev);
          if(hi-low>WHS.SOFT_CAP) hi = r1(low+WHS.SOFT_CAP+(hi-low-WHS.SOFT_CAP)/2);
          hi = Math.min(hi, r1(low+WHS.HARD_CAP));
        }
      }
      e.hi = hi;
      e.hist.push({fecha:r.fecha, hi, n:e.difs.length});
      acts.push({ronda:ri, fecha:r.fecha, campo:c, barras:bar, tee, par, apodo:ap, golpes:g, bruto, ags, dif,
                 hiAntes, hiDespues:hi, ch, ph, stb, neto, G:girTramo(r,ap,0,g,c.hoyos)});
    });
  });
  return {acts, est};
}

// ============================================================
// UI
// ============================================================
const {acts:ACTS, est:EST} = procesar();

// Vueltas de 9 del Executive en orden cronológico, con el HCP Executive de
// cada jugador antes y después de cada vuelta.
function procesarExecutive(){
  const c = campoPorId(EXEC.CAMPO); if(!c) return {vueltas:[], est:{}};
  const hv = c.hoyos.slice(0, EXEC.HOYOS_VUELTA);
  const parV = hv.reduce((s,h)=>s+h.par,0);
  const rondas = GOLF_RONDAS.map((r,i)=>({...r,_i:i})).filter(r=>r.campo===EXEC.CAMPO)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||a._i-b._i);
  const est = {}, vueltas = [];
  rondas.forEach(r=>{
    Object.entries(r.jugadores).forEach(([ap,g0])=>{
      for(let k=0; k*EXEC.HOYOS_VUELTA < g0.length; k++){
        const trozo = g0.slice(k*EXEC.HOYOS_VUELTA, (k+1)*EXEC.HOYOS_VUELTA);
        if(trozo.length < EXEC.HOYOS_VUELTA || trozo.some(v=>v==null)) continue;
        const g = trozo.map((v,h)=>Math.min(v, hv[h].par+WHS.TOPE_JUEGO));
        const bruto = g.reduce((s,x)=>s+x,0);
        const e = est[ap] || (est[ap]={dpars:[], hcp:null});
        const hcpAntes = e.hcp;
        e.dpars.push(bruto-parV);
        const ult = e.dpars.slice(-EXEC.VENTANA);
        e.hcp = e.dpars.length>=EXEC.VENTANA ? r1(ult.reduce((s,x)=>s+x,0)/ult.length) : null;
        vueltas.push({fecha:r.fecha, apodo:ap, n:k+1, golpes:g, hoyos:hv, par:parV, bruto, dpar:bruto-parV, hcpAntes, hcpDespues:e.hcp, G:girTramo(r,ap,k*EXEC.HOYOS_VUELTA,g,hv)});
      }
    });
  });
  return {vueltas, est, parV, hv};
}
const EXEC_DATOS = procesarExecutive();
const fotoJ = ap => { const j=jugador(ap);
  return j.foto ? `<img src="${j.foto}" alt="">` : `<span class="ini" style="background:${j.color||'#eee'}">${ap[0]}</span>`; };
const jugHTML = ap => `<span class="jug">${fotoJ(ap)}<span>${ap}</span></span>`;
// GIR de un jugador en un tramo de hoyos [desde, desde+n): null si la ronda no trae GIR.
function girTramo(r, ap, desde, golpes, hoyos){
  if(!r.gir || !r.gir[ap]) return null;
  const set = new Set(r.gir[ap]);
  const gir = golpes.map((_,h)=>set.has(desde+h+1));
  const tp = gir.map((x,h)=>x && golpes[h]>=hoyos[h].par+1);
  return {gir, tp, nGir:gir.filter(Boolean).length, n3p:tp.filter(Boolean).length};
}
const puntoGir = (G,h) => !G||!G.gir[h] ? '' : `<span class="gir${G.tp[h]?' tp':''}"></span>`;
const claseHoyo = d => d<=-2?'ea':d===-1?'bi':d===0?'pa':d===1?'bo':'db';
const vacio = t => `<div class="vacio">${t}</div>`;

// Casillas de hándicap con el mismo estilo que el Hándicap G de pitch & putt.
// items: {ap, hcp, n, delta}. Sin hándicap: casilla discontinua con el progreso n/ventana.
// Pulsar una casilla abre la ficha del jugador en Equipo.
function casillasHcp(items, ventana, fmtV, tipo){
  const con = items.filter(d=>d.hcp!=null).sort((a,b)=>a.hcp-b.hcp);
  const sin = items.filter(d=>d.hcp==null).sort((a,b)=>(b.n-a.n)||a.ap.localeCompare(b.ap,'es'));
  let h = '<div style="max-width:600px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 0 16px">';
  con.concat(sin).forEach(d=>{
    const col = jugador(d.ap).color || '#e5e7eb';
    const click = d.n>0 ? `data-hcpficha="${d.ap}" data-tipo="${tipo}"` : '';
    const cur = d.n>0 ? 'cursor:pointer;' : '';
    if(d.hcp==null){
      const n = Math.min(d.n||0, ventana), faltan = ventana-n;
      const seg = Array.from({length:ventana},(_,i)=>`<span style="flex:1;height:7px;border-radius:2px;background:${i<n?col:'#e5e7eb'};${i<n?'box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)':''}"></span>`).join('');
      const txt = n===0 ? 'sin estrenar' : (faltan===1 ? '¡falta 1!' : 'faltan '+faltan);
      h += `<div ${click} style="position:relative;background:#fff;border-radius:14px;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;border:2px dashed ${col};${cur}">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:4px">${d.ap}</div>
        <div style="font-family:'Fraunces',serif;font-weight:700;line-height:1;color:#1a1a1a"><span style="font-size:34px">${n}</span><span style="font-size:16px;color:#9ca3af">/${ventana}</span></div>
        <div style="display:flex;gap:2px;width:100%;margin-top:8px">${seg}</div>
        <div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">${txt}</div></div>`;
      return;
    }
    let deltaTxt = '';
    if(d.delta!=null){ const r=Math.round(d.delta*10)/10;
      if(r!==0) deltaTxt = ` <span style="color:${r>0?'#991b1b':'#15803d'}">(${r>0?'+':'−'}${Math.abs(r).toFixed(1).replace('.',',')})</span>`; }
    h += `<div ${click} style="position:relative;background:${col};border-radius:14px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;border:1px solid rgba(0,0,0,0.06);${cur}">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:6px">${d.ap}</div>
      <span style="font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:#1a1a1a;line-height:1;letter-spacing:-0.5px">${fmtV(d.hcp)}</span>
      <div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">${d.n} vueltas${deltaTxt}</div></div>`;
  });
  return h + '</div></div>';
}
function enlazarCasillas(el){
  el.querySelectorAll('[data-hcpficha]').forEach(c=>c.addEventListener('click',()=>{
    FICHA=c.dataset.hcpficha; FICHA_TIPO=c.dataset.tipo; FICHA_VENT='hist';
    showTab('equipo'); RENDER.equipo(document.getElementById('tab-equipo')); window.scrollTo(0,0);
  }));
}
function renderHandicap(el){
  const filas = EQUIPO.map(j=>{
    const e=EST[j.apodo]; const n=e?e.difs.length:0;
    const mis=ACTS.filter(a=>a.apodo===j.apodo);
    return {ap:j.apodo, hi:e&&n>=WHS.TABLA_MIN?e.hi:null, n, ult:mis.length?mis[mis.length-1]:null};
  });
  const con = filas.filter(f=>f.hi!=null).sort((a,b)=>a.hi-b.hi);
  const sin = filas.filter(f=>f.hi==null).sort((a,b)=>b.n-a.n||a.ap.localeCompare(b.ap));
  let h = `<h2>Hándicap</h2><p class="nota">Sistema Mundial de Hándicap: media de los 8 mejores diferenciales de las últimas 20 vueltas (con menos vueltas, tabla oficial desde 3). Todos empiezan sin hándicap. Diferencial = 113 / slope × (resultado ajustado − CR). Se juega a triple bogey: cada hoyo cuenta como máximo par + 3. Para el diferencial, sin índice el tope es par + 5 y con índice doble bogey neto (se aplica el menor).</p>`;
  const items = filas.map(f=>{ const hist=(EST[f.ap]||{hist:[]}).hist.filter(x=>x.hi!=null);
    return {ap:f.ap, hcp:f.hi, n:f.n, delta: hist.length>=2 ? hist[hist.length-1].hi-hist[hist.length-2].hi : null}; });
  el.innerHTML = h + casillasHcp(items, WHS.TABLA_MIN, fmt1, 'c18');
  enlazarCasillas(el);
}

function renderTabla(el){

}

function contarTipos(a){
  const t={ea:0,bi:0,pa:0,bo:0,db:0};
  a.golpes.forEach((v,h)=>t[claseHoyo(v-a.campo.hoyos[h].par)]++);
  return t;
}
function renderStats(el){
  let h = `<h2>Stats</h2>`;
  if(!ACTS.length) return el.innerHTML = h + vacio('Aún no hay vueltas registradas.');
  h += `<div class="wrap"><table><tr><th class="izq">Jugador</th><th>Vueltas</th><th>Media bruto</th><th>Mejor</th><th>Eagles</th><th>Birdies</th><th>Pares</th><th>Bogeys</th><th>Dobles+</th><th>Media par 3</th><th>Media par 4</th><th>Media par 5</th></tr>`;
  EQUIPO.forEach(j=>{

    const t={ea:0,bi:0,pa:0,bo:0,db:0}; const pp={3:[],4:[],5:[]};
    mis.forEach(a=>{ const c=contarTipos(a); Object.keys(t).forEach(k=>t[k]+=c[k]); a.golpes.forEach((v,i)=>pp[a.campo.hoyos[i].par].push(v)); });
    const med = arr => arr.length ? (arr.reduce((s,x)=>s+x,0)/arr.length).toFixed(2).replace('.',',') : '—';
    h+=`<tr><td class="izq">${jugHTML(j.apodo)}</td><td>${mis.length}</td><td class="num">${med(mis.map(a=>a.bruto))}</td><td class="num big">${Math.min(...mis.map(a=>a.bruto))}</td><td>${t.ea}</td><td>${t.bi}</td><td>${t.pa}</td><td>${t.bo}</td><td>${t.db}</td><td class="num">${med(pp[3])}</td><td class="num">${med(pp[4])}</td><td class="num">${med(pp[5])}</td></tr>`;
  });
  el.innerHTML = h + `</table></div>`;
}

function renderRecords(el){
  let h = `<h2>Records</h2>`;
  if(!ACTS.length) return el.innerHTML = h + vacio('Aún no hay vueltas registradas.');
  // Por vuelta: birdies (birdie o mejor), pares o mejor, y sus rachas seguidas.
  const datos = ACTS.map(a=>{
    let bi=0, po=0, rBi=0, rPo=0, cBi=0, cPo=0;
    a.golpes.forEach((v,i)=>{ const d=v-a.campo.hoyos[i].par;
      if(d<=-1){ bi++; cBi++; } else cBi=0;
      if(d<=0){ po++; cPo++; } else cPo=0;
      rBi=Math.max(rBi,cBi); rPo=Math.max(rPo,cPo); });
    return {a, bi, po, rBi, rPo, dpar:a.bruto-a.par};
  });
  const pie = x => `${fmtFecha(x.a.fecha)} · ${x.a.campo.corto}`;

  // 1. Mejor resultado de cada uno (respecto al par, para comparar campos distintos)
  const mejores = EQUIPO.map(j=>{
    const mis = datos.filter(x=>x.a.apodo===j.apodo); if(!mis.length) return null;
    const m = Math.min(...mis.map(x=>x.dpar));
    return {ap:j.apodo, d:m, vs:mis.filter(x=>x.dpar===m)};
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
  h += `<h3>Mejor resultado de cada uno</h3><div class="wrap"><table><tr><th>#</th><th class="izq">Jugador</th><th>+/- par</th><th>Bruto</th><th class="izq">Dónde y cuándo</th></tr>`;
  let pos=0, prev=null;
  mejores.forEach((f,i)=>{ if(f.d!==prev){ pos=i+1; prev=f.d; }
    h += `<tr><td>${pos}</td><td class="izq">${jugHTML(f.ap)}</td><td class="big num">${fmtD(f.d)}</td><td class="num">${f.vs.map(x=>x.a.bruto).join(' / ')}</td><td class="izq">${f.vs.map(pie).join('<br>')}</td></tr>`; });
  h += `</table></div><p class="nota">Ordenado por resultado respecto al par, para poder comparar campos con distinto par.</p>`;

  // 2-5. Récords del club
  const record = (k) => { const v=Math.max(...datos.map(x=>x[k])); return v>0 ? {v, quien:datos.filter(x=>x[k]===v)} : null; };
  const card = (t,r) => `<div class="card"><div class="t">${t}</div>${r?`<div class="v">${r.v}</div>${r.quien.map(x=>`<div class="s">${x.a.apodo} · ${pie(x)}</div>`).join('')}`:'<div class="s">—</div>'}</div>`;
  h += `<h3>Récords</h3><div class="cards">`;
  h += card('Más birdies en un partido', record('bi'));
  h += card('Más birdies seguidos', record('rBi'));
  h += card('Más pares o mejor en un partido', record('po'));
  h += card('Más pares o mejor seguidos', record('rPo'));
  h += `</div><p class="nota">Birdie cuenta birdie o mejor (eagle incluido). Las rachas son dentro de una misma vuelta.</p>`;
  el.innerHTML = h;
}

    if(c.tees){ h += `<div class="wrap"><table><tr><th class="izq">Barras</th>${BARRAS.map(b=>`<th>${BARRAS_NOMBRE[b]}</th>`).join('')}</tr>`;
    h += `<tr><td class="izq">CR</td>${BARRAS.map(b=>`<td class="num">${fmt1(c.tees[b].cr)}</td>`).join('')}</tr>`;
    h += `<tr><td class="izq">Slope</td>${BARRAS.map(b=>`<td class="num">${c.tees[b].slope}</td>`).join('')}</tr>`;
    h += `<tr><td class="izq">Metros</td>${BARRAS.map(b=>`<td class="num">${c.hoyos.reduce((s,x)=>s+x.m[b],0)}</td>`).join('')}</tr></table></div>`; }
    const media = i => { const v=ac.map(a=>a.golpes[i]).filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };
    h += `<div class="wrap" style="margin-top:8px"><table><tr><th class="izq">Hoyo</th>${c.hoyos.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>`;
    h += `<tr><td class="izq">Par</td>${c.hoyos.map(x=>`<td>${x.par}</td>`).join('')}</tr>`;
    h += `<tr><td class="izq">Hcp</td>${c.hoyos.map(x=>`<td class="dim">${x.hcp??'—'}</td>`).join('')}</tr>`;
    h += `<tr><td class="izq">${BARRAS_NOMBRE[BARRAS_DEFECTO]} (m)</td>${c.hoyos.map(x=>`<td class="num">${x.m?x.m[BARRAS_DEFECTO]:'—'}</td>`).join('')}</tr>`;
    h += `<tr><td class="izq">Media equipo</td>${c.hoyos.map((x,i)=>{const m=media(i); return m==null?'<td class="dim">—</td>':`<td class="num ${claseHoyo(Math.round(m-x.par))}">${m.toFixed(2).replace('.',',')}</td>`;}).join('')}</tr></table></div>`;
    h += `<p class="nota">${ac.length} ${esExec?'vueltas':'actuaciones'} en este campo.</p>`;
  });
  el.innerHTML = h;
}

<div class="tj-wrap">

  const $ = s => el.querySelector(s);
  const msg=$('#tjMsg'), out=$('#tjOut'), btnCopy=$('#tjCopy');

  function copiarTarjeta(){
    if(!out.value) return;
    const ok = () => {
      btnCopy.classList.add('done'); btnCopy.textContent='Copiado ✓';
      setTimeout(()=>{ btnCopy.classList.remove('done'); btnCopy.textContent='Copiar tarjeta'; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out.value).then(ok).catch(()=>{ legacy(); });
    } else { legacy(); }
    function legacy(){
      out.removeAttribute('readonly');
      out.focus(); out.select(); out.setSelectionRange(0, out.value.length);
      let hecho=false;
      try{ hecho=document.execCommand('copy'); }catch(e){}
      out.setAttribute('readonly','');
      if(hecho) ok();
      else { btnCopy.textContent='Selecciona y copia a mano'; setTimeout(()=>{btnCopy.textContent='Copiar tarjeta';},2200); }
    }
  }
  btnCopy.addEventListener('click', copiarTarjeta);

  function tablaHTML(){
    if(!sel.length) return '<tr><td class="tj-empty">Sin jugadores seleccionados.</td></tr>';
    const c = campo();
    let h='<tr><th class="tj-corner">Hole</th><th class="tj-hh tot tj-dl">Δ</th>';
    for(let i=0;i<N_HOYOS;i++) h+='<th class="tj-hh'+(act&&act.h===i?' on':'')+'">'+(i+1)+'</th>';
    h+='<th class="tj-hh tot">TOT</th></tr>';
    h+='<tr><td class="tj-corner p">Par</td><td class="tj-par tj-dl"></td>';

    h+='<td class="tj-par">'+parCampo(c)+'</td></tr>';
    sel.forEach(jug=>{
      const col = COL[jug] || '#eef0f4';
      h+='<tr><td class="tj-who" style="background:'+col+'">'+jug+'</td><td class="tj-sum tj-dl">'+fmtDelta(delta(jug))+'</td>';
      for(let i=0;i<N_HOYOS;i++){
        const v=G[jug][i];
        let cls='tj-cel';
        if(act && act.jug===jug && act.h===i) cls+=' act';
        if(v!==null){ const d=v-c.hoyos[i].par; if(d<=-1)cls+=' bir'; else if(d===1)cls+=' bog'; else if(d>=2)cls+=' dbl'; }
        h+='<td><button type="button" class="'+cls+'" data-j="'+jug+'" data-h="'+i+'">'+(v===null?'':String(v))+'</button></td>';
      }
      const tot=suma(jug); h+='<td class="tj-sum">'+(tot===null?'—':tot)+'</td></tr>';   // al final: golpes totales (el delta va al principio)
    });
    return h;
  }

  function pinta(){
    $('#tjG').innerHTML=tablaHTML();
    el.querySelectorAll('.tj-chip').forEach(c=>c.classList.toggle('on', sel.includes(c.dataset.j)));
    el.querySelectorAll('.tj-cel').forEach(b=>b.addEventListener('click',()=>{ act={jug:b.dataset.j,h:+b.dataset.h}; pinta(); }));
    $('#tjNow').innerHTML = act
      ? '<b>'+act.jug+'</b> · hoyo <b>'+(act.h+1)+'</b> · par <b>'+parH(act.h)+'</b>'
      : (sel.length ? 'Toca una casilla para empezar' : 'Elige jugadores para empezar');
    const v = act ? G[act.jug][act.h] : null;
    const box=$('#tjVal');
    box.textContent = (v===null ? '—' : String(v));
    box.classList.toggle('vacio', v===null);
  }

  function mover(d){
    if(!act || !sel.length) return;
    let idx=sel.indexOf(act.jug), h=act.h+d;
    if(h>N_HOYOS-1){ h=0; idx=(idx+1)%sel.length; }
    if(h<0){ h=N_HOYOS-1; idx=(idx-1+sel.length)%sel.length; }
    act={jug:sel[idx],h}; pinta();
  }
  function siguiente(){
    if(!act || !sel.length) return;
    if(sel.indexOf(act.jug) === sel.length-1){ act={jug:sel[0], h:(act.h+1)%N_HOYOS}; pinta(); }
    else mover(1);
  }
  function bajar(){
    if(!act || !sel.length) return;
    let idx=sel.indexOf(act.jug)+1, h=act.h;
    if(idx>=sel.length){ idx=0; h=(h+1)%N_HOYOS; }
    act={jug:sel[idx],h}; pinta();
  }
  // Casilla vacía: + → par, − → birdie. Tope de juego: par + 3 (triple bogey).
  function bump(d){
    if(!act){ msg.className='tj-msg'; msg.textContent='Toca primero una casilla.'; return; }
    msg.textContent='';
    const v=G[act.jug][act.h], p=parH(act.h);
    if(v===null){ G[act.jug][act.h] = d>0 ? p : p-1; }
    else if(d<0 && v<=1){ G[act.jug][act.h]=null; }   // − desde 1: casilla vacía
    else { G[act.jug][act.h]=Math.max(1,Math.min(topeH(act.h),v+d)); }
    pinta();
  }

  el.querySelectorAll('.tj-chip').forEach(c=>c.addEventListener('click',()=>{
    const j=c.dataset.j;
    if(sel.includes(j)){
      sel=sel.filter(x=>x!==j);
      G[j]=new Array(N_HOYOS).fill(null);
      if(act && act.jug===j) act = sel.length ? {jug:sel[0],h:0} : null;
    }else{
      sel.push(j);
      if(!act) act={jug:j,h:0};
    }
    pinta();
  }));

  // Al cambiar de campo, los golpes por encima del nuevo tope se recortan.
  $('#tjCampo').addEventListener('change',()=>{
    sel.forEach(j=>G[j]=G[j].map((v,h)=>v===null?null:Math.min(v,topeH(h))));
    out.value=''; btnCopy.disabled=true; pinta();
  });
  $('#tjMas').addEventListener('click',()=>bump(1));
  $('#tjMenos').addEventListener('click',()=>bump(-1));
  $('#tjAnt').addEventListener('click',()=>mover(-1));
  $('#tjSig').addEventListener('click',siguiente);
  $('#tjBaja').addEventListener('click',bajar);

  $('#tjNew').addEventListener('click',()=>{
    sel=[]; act=null; JUGS.forEach(j=>{ G[j]=new Array(N_HOYOS).fill(null); });
    out.value=''; btnCopy.disabled=true; msg.className='tj-msg'; msg.textContent=''; pinta();
  });

  $('#tjFin').addEventListener('click',()=>{
    if(!sel.length){ msg.className='tj-msg'; msg.textContent='No hay ningún jugador en la tarjeta.'; out.value=''; btnCopy.disabled=true; return; }
    const faltan=sel.filter(j=>!completo(j));
    if(faltan.length){
      msg.className='tj-msg';
      msg.textContent='Faltan hoyos: '+faltan.map(j=>j+' ('+G[j].filter(v=>v===null).length+')').join(', ');
      out.value=''; btnCopy.disabled=true; return;
    }
    const c=campo(), iso=$('#tjFecha').value;
    const fecha = iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
    const orden=[...sel].sort((a,b)=>suma(a)-suma(b));
    const L=['=== TARJETA GOLF INICIO ===','fecha='+fecha,'campo='+c.id,'barras='+$('#tjBarras').value,''];
    orden.forEach(j=>L.push('jugador='+j+' hoyos='+G[j].join(' ')+' total='+suma(j)));
    L.push('=== TARJETA GOLF FIN ===');
    out.value=L.join('\n');
    msg.className='tj-msg ok'; msg.textContent='Tarjeta generada.';
    btnCopy.disabled=false;
    copiarTarjeta();
  });

  pinta();
}


function renderExecutive(el){
  const {vueltas, est, parV, hv} = EXEC_DATOS;
  let h = `<h2>Executive</h2><p class="nota">Campo especial (9 hoyos jugados dos veces, par ${parV}), con hándicap propio que no se mezcla con el de los demás campos. Cada partida cuenta como una vuelta de ${EXEC.HOYOS_VUELTA} hoyos. HCP Executive = media de los golpes sobre el par (${parV}) de las últimas ${EXEC.VENTANA} vueltas, sin descartes; no hay HCP hasta completar ${EXEC.VENTANA}. Se juega a triple bogey: cada hoyo cuenta como máximo par + ${WHS.TOPE_JUEGO}.</p>`;
  const sinVueltas = !vueltas.length;
  const pie = v => fmtFecha(v.fecha);
  // Subpestañas: Hándicap · Tabla · Records
  const SUB = [['hcp','📉 Hándicap'],['tabla','📋 Tabla'],['records','🏆 Records']];
  h += `<div class="tabs" style="border-bottom:1px solid #e5e7eb;margin-bottom:6px">${SUB.map(([k,t],i)=>`<div class="tab exsub${i?'':' active'}" data-sub="${k}">${t}</div>`).join('')}</div>`;
  if(sinVueltas){
    h += SUB.map(([k],i)=>`<div class="exsec" data-sec="${k}"${i?' style="display:none"':''}>${vacio('Aún no hay vueltas en el Executive.')}</div>`).join('');
  } else {
  h += `<div class="exsec" data-sec="hcp">`;
  // Hándicap Executive: casillas como el Hándicap G de pitch & putt
  const itemsEx = EQUIPO.map(j=>{ const mis=vueltas.filter(v=>v.apodo===j.apodo); const e=est[j.apodo]; const u=mis[mis.length-1];
    return {ap:j.apodo, hcp:e?e.hcp:null, n:mis.length, delta: u && u.hcpAntes!=null && u.hcpDespues!=null ? u.hcpDespues-u.hcpAntes : null}; });
  const fmtEx = x => (x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(1).replace('.',',');
  h += `<h3>Hándicap Executive</h3>` + casillasHcp(itemsEx, EXEC.VENTANA, fmtEx, 'exec');
  h += `</div>`;
  // Tabla de vueltas
  h += `<div class="exsec" data-sec="tabla" style="display:none"><h3>Tabla de vueltas</h3><div class="wrap"><table><tr><th>Fecha</th><th class="izq">Jugador</th>${hv.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>Bruto</th><th>+/- par</th><th>GIR</th><th>3P</th><th>HCP después</th></tr>`;
  vueltas.slice().reverse().forEach(v=>{
    h+=`<tr><td>${fmtFecha(v.fecha)}</td><td class="izq">${jugHTML(v.apodo)}</td>${v.golpes.map((g,i)=>`<td class="${claseHoyo(g-hv[i].par)}">${g}${puntoGir(v.G,i)}</td>`).join('')}<td class="big num">${v.bruto}</td><td class="num">${fmtD(v.dpar)}</td><td class="num">${v.G?v.G.nGir:'—'}</td><td class="num">${v.G?v.G.n3p:'—'}</td><td class="num">${fmt1(v.hcpDespues)}</td></tr>`; });
  h += `</table></div><p class="nota"><span class="gir"></span> GIR (green en regulación) · <span class="gir tp"></span> GIR con tripateo (par + 1 o más).</p></div>`;
  // Records
  h += `<div class="exsec" data-sec="records" style="display:none">`;
  const datos = vueltas.map(v=>{ let bi=0, po=0;
    v.golpes.forEach((g,i)=>{ const d=g-hv[i].par; if(d<=-1) bi++; if(d<=0) po++; }); return {v, bi, po}; });
  const mejores = EQUIPO.map(j=>{ const mis=datos.filter(x=>x.v.apodo===j.apodo); if(!mis.length) return null;
    const m=Math.min(...mis.map(x=>x.v.bruto)); return {ap:j.apodo, m, vs:mis.filter(x=>x.v.bruto===m)}; }).filter(Boolean).sort((a,b)=>a.m-b.m);
  h += `<h3>Mejor vuelta de cada uno</h3><div class="wrap"><table><tr><th>#</th><th class="izq">Jugador</th><th>Bruto</th><th>+/- par</th><th class="izq">Cuándo</th></tr>`;
  let pos=0, prev=null;
  mejores.forEach((f,i)=>{ if(f.m!==prev){ pos=i+1; prev=f.m; }
    h+=`<tr><td>${pos}</td><td class="izq">${jugHTML(f.ap)}</td><td class="big num">${f.m}</td><td class="num">${fmtD(f.m-parV)}</td><td class="izq">${f.vs.map(x=>pie(x.v)).join('<br>')}</td></tr>`; });
  h += `</table></div>`;
  const record = k => { const v=Math.max(...datos.map(x=>x[k])); return v>0 ? {v, quien:datos.filter(x=>x[k]===v)} : null; };
  const card = (t,r) => `<div class="card"><div class="t">${t}</div>${r?`<div class="v">${r.v}</div>${r.quien.map(x=>`<div class="s">${x.v.apodo} · ${pie(x.v)}</div>`).join('')}`:'<div class="s">—</div>'}</div>`;
  h += `<h3>Récords</h3><div class="cards">` + card('Más birdies en una vuelta', record('bi')) + card('Más pares o mejor en una vuelta', record('po')) + `</div></div>`;
  }
  el.innerHTML = h;
  enlazarCasillas(el);
  el.querySelectorAll('.exsub').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('.exsub').forEach(x=>x.classList.toggle('active',x===b));
    el.querySelectorAll('.exsec').forEach(x=>x.style.display = x.dataset.sec===b.dataset.sub ? '' : 'none');
  }));
}


// ============================================================
// EQUIPO: lista de jugadores y ficha de cada uno (clic en el nombre)
// ============================================================
// Tipos de hoyo de la distribución, de mejor a peor. La lista manda: añadir
// una entrada crea su línea en la tabla y su porción en el anillo.
// Mismos colores que la ficha de pitch & putt: `col` = número en la tabla, `tono` = porción del anillo.
const TIPOS_HOYO = [
  {k:'ea', n:'Eagles o mejor', test:d=>d<=-2, col:'#b45309', tono:'#b45309'},
  {k:'bi', n:'Birdies',        test:d=>d===-1, col:'#15803d', tono:'#22c55e'},
  {k:'pa', n:'Pares',          test:d=>d===0,  col:'#1a1a1a', tono:'#cbd5e1'},
  {k:'bo', n:'Bogeys',         test:d=>d===1,  col:'#2563eb', tono:'#3b82f6'},
  {k:'do', n:'Dobles',         test:d=>d===2,  col:'#1e3a8a', tono:'#1e3a8a'},
  {k:'tr', n:'Triple bogey',   test:d=>d>=3,   col:'#dc2626', tono:'#dc2626'}
];
const VENTANAS_FICHA = [10, 20];   // + Histórico
let FICHA = null;                  // apodo abierto (null = lista)
let FICHA_TIPO = 'c18';            // 'c18' (campos de 18) | 'exec'
let FICHA_VENT = 'hist';           // nº de vueltas o 'hist'
// Todas las vueltas de un jugador en un mismo formato, ordenadas por fecha.
function vueltasJugador(ap, tipo){
  if(tipo==='exec') return EXEC_DATOS.vueltas.filter(v=>v.apodo===ap)
    .map(v=>({fecha:v.fecha, donde:'Executive', golpes:v.golpes, pars:v.hoyos.map(x=>x.par), bruto:v.bruto, dpar:v.dpar, G:v.G}));
  return ACTS.filter(a=>a.apodo===ap)
    .map(a=>({fecha:a.fecha, donde:a.campo.corto, golpes:a.golpes, pars:a.campo.hoyos.map(x=>x.par), bruto:a.bruto, dpar:a.bruto-a.par, G:a.G}));
}
function anillo(cuentas){
  const tot = cuentas.reduce((s,c)=>s+c.v,0); if(!tot) return '';
  const R=54, C=2*Math.PI*R; let off=0, h='';
  cuentas.forEach(c=>{ if(!c.v) return; const l=C*c.v/tot;
    h+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c.tono}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off+=l; });
  return `<svg viewBox="0 0 140 140" width="140" height="140">${h}<text x="70" y="67" text-anchor="middle" font-size="18" font-weight="700">${tot}</text><text x="70" y="84" text-anchor="middle" font-size="10" fill="#777">hoyos</text></svg>`;
}
function grafProgresion(vs){
  if(vs.length<2) return vacio('Hacen falta al menos 2 vueltas para ver la progresión.');
  const W=520, H=160, P=28, ys=vs.map(v=>v.dpar), mn=Math.min(...ys), mx=Math.max(...ys), rg=(mx-mn)||1;
  const X=i=>P+i*(W-2*P)/(vs.length-1), Y=y=>P+(mx-y)*(H-2*P)/rg;
  const pts=vs.map((v,i)=>`${X(i)},${Y(v.dpar)}`).join(' ');
  return `<div class="wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    <text x="4" y="${Y(mx)+4}" font-size="10" fill="#777">${fmtD(mx)}</text><text x="4" y="${Y(mn)+4}" font-size="10" fill="#777">${fmtD(mn)}</text>
    <polyline points="${pts}" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    ${vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v.dpar)}" r="3.5" fill="#1a1a1a"><title>${fmtFecha(v.fecha)} · ${v.donde} · ${v.bruto} (${fmtD(v.dpar)})</title></circle>`).join('')}
  </svg></div><p class="nota">Golpes sobre el par de cada vuelta, de la más antigua a la más reciente.</p>`;
}
function renderEquipo(el){
  if(FICHA) return renderFicha(el, FICHA);
  // Mismo aspecto que la tabla de Equipo de pitch & putt.
  const tdL='padding:6px 10px;border:none;border-bottom:1px solid #f0f0f0;font-size:11px;white-space:nowrap;text-align:left;';
  const tdC=tdL+'text-align:center;';
  const thL='padding:7px 10px;border:none;font-size:11px;font-weight:600;background:#ede9fe;color:#5b21b6;white-space:nowrap;text-align:left;';
  const thC=thL+'text-align:center;';
  let h = `<div style="overflow-x:auto;border-radius:10px;border:1px solid #ede9fe;display:inline-block;max-width:100%">`
    + `<div style="font-size:11px;color:#555;padding:6px 10px;font-weight:600;border-bottom:1px solid #ede9fe">Equipo <span style="font-weight:400;color:#888">· ${EQUIPO.length}</span></div>`
    + `<table style="border-collapse:collapse"><thead><tr><th style="${thC}">Nº socio</th><th style="${thL}">Nickname</th><th style="${thC}">Vueltas 18</th><th style="${thC}">Hándicap</th><th style="${thC}">Vueltas Executive</th><th style="${thC}">HCP Executive</th></tr></thead><tbody>`;
  EQUIPO.forEach((j,i)=>{
    const e=EST[j.apodo], x=EXEC_DATOS.est[j.apodo];
    const n18=ACTS.filter(a=>a.apodo===j.apodo).length, nEx=x?x.dpars.length:0;
    const bg=i%2===0?'#f3f4f6':'#e5e7eb';
    const badge=`<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;background:${j.color||'#e5e7eb'};font-size:9px;font-weight:700;color:#333">${j.num??''}</span>`;
    h+=`<tr style="background:${bg};cursor:pointer" data-ficha="${j.apodo}" title="Ver ficha de ${j.apodo}"><td style="${tdC}">${badge}</td><td style="${tdL}"><strong style="border-bottom:1px dotted #9ca3af">${j.apodo}</strong></td><td style="${tdC}">${n18}</td><td style="${tdC}">${fmt1(e?e.hi:null)}</td><td style="${tdC}">${nEx}</td><td style="${tdC}">${x&&x.hcp!=null?fmtD(x.hcp):'—'}</td></tr>`;
  });
  el.innerHTML = h + `</tbody></table></div><p class="nota">Pulsa en un jugador para ver su ficha.</p>`;
  el.querySelectorAll('[data-ficha]').forEach(r=>r.addEventListener('click',()=>{ FICHA=r.dataset.ficha; FICHA_TIPO = vueltasJugador(FICHA,'c18').length || !vueltasJugador(FICHA,'exec').length ? 'c18' : 'exec'; FICHA_VENT='hist'; renderEquipo(el); window.scrollTo(0,0); }));
}
function renderFicha(el, ap){
  const j=jugador(ap), e=EST[ap], x=EXEC_DATOS.est[ap];
  const v18=vueltasJugador(ap,'c18'), vEx=vueltasJugador(ap,'exec');
  const todas = FICHA_TIPO==='exec' ? vEx : v18;
  const vs = FICHA_VENT==='hist' ? todas : todas.slice(-FICHA_VENT);
  const foto = j.foto ? `<img src="${j.foto}" alt="" style="width:100%;max-width:200px;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin:0 auto">`
    : `<div style="width:100%;max-width:200px;aspect-ratio:1;border-radius:12px;background:${j.color||'#eee'};display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:56px;font-weight:700;opacity:.6">${ap.slice(0,2).toUpperCase()}</div>`;
  const fila = (k,v) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f0f0f0"><span style="font-size:11px;color:#6b7280">${k}</span><span style="font-weight:700">${v}</span></div>`;
  const btn = (on,attr,txt,apagado) => `<button ${attr} ${apagado?'disabled':''} style="font-size:11px;padding:4px 10px;border:1px solid ${on?'#1a1a1a':'#d1d5db'};background:${on?'#1a1a1a':'#fff'};color:${on?'#fff':(apagado?'#bbb':'#374151')};border-radius:6px;cursor:${apagado?'default':'pointer'}">${txt}</button>`;
  let h = `<div class="fila"><button id="fiVolver" style="font-size:12px;padding:5px 12px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;cursor:pointer">← Equipo</button><span style="font-weight:700;font-size:16px">${ap}</span></div>`;
  h += `<div class="cards">`;
  h += `<div class="card">${foto}<div style="margin-top:10px">${fila('Nº de socio', j.num??'—')}${fila('Vueltas campos de 18', v18.length)}${fila('Vueltas Executive', vEx.length)}</div></div>`;
  const nHi = e?e.difs.length:0, nEx = vEx.length;
  h += `<div class="card"><div class="t">Hándicaps</div>`
    + fila('Hándicap (WHS)', e&&e.hi!=null ? fmt1(e.hi) : (nHi<3?`— <span style="font-weight:400;color:#999;font-size:11px">faltan ${3-nHi} vueltas</span>`:'—'))
    + fila('HCP Executive', x&&x.hcp!=null ? fmtD(x.hcp) : `— <span style="font-weight:400;color:#999;font-size:11px">faltan ${EXEC.VENTANA-nEx} vueltas</span>`);
  const mejor = l => { if(!l.length) return '—'; const m=Math.min(...l.map(v=>v.bruto)); const b=l.filter(v=>v.bruto===m);
    return `${m} (${fmtD(b[0].dpar)}) <span style="font-weight:400;color:#999;font-size:11px">${b.map(v=>fmtFecha(v.fecha)+(l===v18?' · '+v.donde:'')).join(', ')}</span>`; };
  h += `<div class="t" style="margin-top:12px">Mejor vuelta</div>` + fila('Campos de 18', mejor(v18)) + fila('Executive', mejor(vEx)) + `</div>`;
  h += `</div>`;
  // Selector de tipo de campo y ventana
  h += `<h3>Distribución de golpes</h3><div class="fila">`
    + btn(FICHA_TIPO==='c18','data-ti="c18"','Campos de 18') + btn(FICHA_TIPO==='exec','data-ti="exec"','Executive')
    + `<span style="width:10px"></span>`
    + VENTANAS_FICHA.map(n=>btn(FICHA_VENT===n,`data-ve="${n}"`,`Últimas ${n}`, todas.length<n)).join('')
    + btn(FICHA_VENT==='hist','data-ve="hist"','Histórico') + `</div>`;
  if(!vs.length) h += vacio(FICHA_TIPO==='exec' ? 'Aún no tiene vueltas en el Executive.' : 'Aún no tiene vueltas en campos de 18.');
  else {
    const cnt = {}; TIPOS_HOYO.forEach(t=>cnt[t.k]=0);
    vs.forEach(v=>v.golpes.forEach((g,i)=>{ const t=TIPOS_HOYO.find(t=>t.test(g-v.pars[i])); if(t) cnt[t.k]++; }));
    const tot = Object.values(cnt).reduce((s,n)=>s+n,0);
    h += `<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center"><div class="wrap"><table><tr><th class="izq">Tipo</th><th>Hoyos</th><th>%</th><th>Por vuelta</th></tr>`
      + TIPOS_HOYO.map(t=>`<tr><td class="izq"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${t.tono};margin-right:6px"></span>${t.n}</td><td class="num" style="font-weight:700;color:${t.col}">${cnt[t.k]}</td><td class="num">${Math.round(100*cnt[t.k]/tot)} %</td><td class="num">${(cnt[t.k]/vs.length).toFixed(1).replace('.',',')}</td></tr>`).join('')
      + `</table></div>${anillo(TIPOS_HOYO.map(t=>({v:cnt[t.k], tono:t.tono})))}</div>`;
    h += `<p class="nota">${vs.length} vuelta${vs.length===1?'':'s'} · media ${(vs.reduce((s,v)=>s+v.bruto,0)/vs.length).toFixed(1).replace('.',',')} golpes (${fmtD(r1(vs.reduce((s,v)=>s+v.dpar,0)/vs.length))}) · se juega a triple bogey.</p>`;
  // GIR y tripateos de la selección (solo vueltas que traen GIR)
  const conG = vs.filter(v=>v.G);
  const sG = conG.reduce((s,v)=>s+v.G.nGir,0), s3 = conG.reduce((s,v)=>s+v.G.n3p,0);
  const med = (s,n) => n ? (s/n).toFixed(1).replace('.',',') : '—';
  h += `<h3>GIR y tripateos</h3><div class="cards"><div class="card">${fila('GIR', conG.length?sG:'—')}${fila('GIR por vuelta', med(sG,conG.length))}${fila('% GIR', conG.length?Math.round(100*sG/(conG.length*18))+' %':'—')}${fila('Tripateos (3P)', conG.length?s3:'—')}${fila('3P por vuelta', med(s3,conG.length))}<div class="s">${conG.length} vuelta${conG.length===1?'':'s'} con GIR apuntado en la selección</div></div></div>`;
    h += `<h3>📈 Progresión</h3>` + grafProgresion(vs);
  }
  el.innerHTML = h;
  el.querySelector('#fiVolver').addEventListener('click',()=>{ FICHA=null; renderEquipo(el); });
  el.querySelectorAll('[data-ti]').forEach(b=>b.addEventListener('click',()=>{ FICHA_TIPO=b.dataset.ti; FICHA_VENT='hist'; renderFicha(el,ap); }));
  el.querySelectorAll('[data-ve]').forEach(b=>b.addEventListener('click',()=>{ if(b.disabled) return; FICHA_VENT=b.dataset.ve==='hist'?'hist':+b.dataset.ve; renderFicha(el,ap); }));
}

const RENDER={tarjeta:renderTarjeta,handicap:renderHandicap,stats:renderStats,tabla:renderTabla,records:renderRecords,campos:renderCampos,executive:renderExecutive,equipo:renderEquipo};
const hecho={};
function showTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  document.querySelectorAll('.content').forEach(x=>x.classList.toggle('on',x.id==='tab-'+t));
  if(!hecho[t]){ RENDER[t](document.getElementById('tab-'+t)); hecho[t]=true; }
}
document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>showTab(x.dataset.tab)));
showTab('handicap');
</script>
